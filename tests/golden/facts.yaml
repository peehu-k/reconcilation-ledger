# Golden normalization fixtures. Each `raw` is what an extractor would emit for a
# verbatim span of a starter PDF; `expect` is the canonical Fact it must normalize to.
# Run offline by tests/test_golden.py - no LLM involved.

- name: delhivery_fy24_revenue_crore
  raw: {fact_kind: numeric, entity_text: "Delhivery Limited", attribute_label: "revenue from services",
        value_text: "8,142 Cr", unit_text: "Cr", period_text: "FY24", quote: "8,142 Cr"}
  ctx: {primary_entity_key: "delhivery", published_date: "2024-05-17"}
  expect: {entity_key: "delhivery", attribute_key: "revenue", value_num: 81420000000.0,
           currency: "INR", unit_canonical: "currency_amount", period_canonical: "FY:2023-24"}

- name: delhivery_fy24_revenue_million
  raw: {fact_kind: numeric, entity_text: "the Company", attribute_label: "revenue from operations",
        value_text: "81,415.38 million", unit_text: "million", period_text: "FY24",
        quote: "81,415.38 million"}
  ctx: {primary_entity_key: "delhivery", published_date: "2024-08-08"}
  expect: {entity_key: "delhivery", attribute_key: "revenue", value_num: 81415380000.0,
           unit_canonical: "currency_amount", period_canonical: "FY:2023-24"}

- name: gdp_growth_first_advance
  raw: {fact_kind: numeric, entity_text: "India", attribute_label: "real GDP growth",
        value_text: "6.4 per cent", unit_text: "per cent", period_text: "FY25",
        estimate_status_text: "first advance estimates", quote: "grow by 6.4 per cent in FY25"}
  ctx: {published_date: "2025-01-30"}
  expect: {entity_key: "india", attribute_key: "real gdp growth", value_num: 0.064,
           unit_canonical: "ratio", period_canonical: "FY:2024-25", estimate_status: "first_advance",
           as_of_date: "2025-01-30"}

