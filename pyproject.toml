[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconciliation-ledger"
version = "0.1.0"
description = "A cross-document Fact Knowledge Layer: extracts grounded facts from PDFs and classifies them as corroborating, contradicting, or reconcilable-by-context."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pymupdf>=1.24",            # PDF text and layout
    "pydantic>=2.4",            # extraction output validation
    "fastapi>=0.104",           # HTTP API
    "uvicorn>=0.24",            # ASGI server
    "jinja2>=3.1",              # HTML templates
    "python-multipart>=0.0.6",  # file upload parsing
    "rapidfuzz>=3.0",           # fuzzy entity / attribute matching
    "pyyaml>=6.0",              # golden fixtures
]

[project.optional-dependencies]
# Optional local embeddings for fuzzy attribute linking. Not required for correctness.
embeddings = ["sentence-transformers>=2.2", "numpy>=1.24"]
dev = ["pytest>=7.0"]

[project.scripts]
rlx = "rlx.cli:main"

[tool.setuptools.packages.find]
include = ["rlx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
